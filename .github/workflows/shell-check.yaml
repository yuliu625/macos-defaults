name: Shell Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  zsh-check:
    name: Zsh Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install zsh
        run: |
          sudo apt update
          sudo apt install -y zsh
      - name: Syntax check
        run: |
          find . -type f -name "*.zsh" -print0 | xargs -0 -n 1 zsh -n

  shell-check:
    name: Shell Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install shellcheck
        run: |
          sudo apt update
          sudo apt install -y shellcheck
      - name: Run shellcheck
        run: |
          find . -type f -name "*.zsh" -print0 | xargs -0 shellcheck -s bash -e SC2088
